<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>CTB Flights</title>
  <link rel="stylesheet" href="./styles.css?v=1.1.0">
</head>
<body data-page="home">
  <header class="site-header">
    <a class="site-brand" href="./index.html" aria-label="CTB Flights 首页">
      <span class="brand-mark">✈</span>
      <span><strong>CTB Flights</strong><small>China ⇄ Belarus</small></span>
    </a>
    <nav class="main-nav" aria-label="主导航">
      <a class="active" href="./index.html">机票查询</a>
      <span>价格日历</span>
      <span>航班筛选</span>
      <span>帮助中心</span>
    </nav>
    <div class="header-actions">
      <span class="currency-chip">人民币 (CNY)</span>
      <span class="version-chip" data-version></span>
    </div>
  </header>

  <main class="home-main">
    <section class="home-hero">
      <div class="hero-copy">
        <span class="eyebrow">专供白俄罗斯留学生</span>
        <h1>在一段时间里，<br>找到真正合适的航班。</h1>
        <p>选择一段出行时间，我们会比较这一时间范围内中国至白俄罗斯的计划航班，并查询当前可获取的实时票价。人民币作为主显示货币，同时保留航空公司返回的原始币种。</p>
        <div class="hero-points">
          <span>时间段比价</span><span>直飞 / 经停</span><span>人民币主显示</span>
        </div>
      </div>

      <section class="search-card" aria-label="机票搜索条件">
        <div class="segmented" role="tablist" aria-label="行程类型">
          <button class="active" data-trip="oneway" type="button">单程</button>
          <button data-trip="roundtrip" type="button">往返</button>
        </div>

        <div class="segmented direction-segment" role="tablist" aria-label="飞行方向">
          <button class="active" data-direction="to-minsk" type="button">中国 → 明斯克</button>
          <button data-direction="from-minsk" type="button">明斯克 → 中国</button>
        </div>

        <div class="form-section">
          <div class="section-title"><span class="step">1</span><strong>去程时间范围</strong></div>
          <div class="date-grid">
            <label><span>最早出发</span><input id="startDate" type="date"></label>
            <div class="date-arrow">→</div>
            <label><span>最晚出发</span><input id="endDate" type="date"></label>
          </div>
        </div>

        <div id="returnRange" class="form-section hidden">
          <div class="section-title"><span class="step">2</span><strong>返程时间范围</strong></div>
          <div class="date-grid">
            <label><span>最早返程</span><input id="returnStartDate" type="date"></label>
            <div class="date-arrow">→</div>
            <label><span>最晚返程</span><input id="returnEndDate" type="date"></label>
          </div>
        </div>

        <div class="form-section city-section">
          <div class="field-head"><strong>比较哪些中国城市？</strong><button id="toggleAll" class="link-button" type="button">取消全选</button></div>
          <div id="cityGrid" class="city-grid"></div>
        </div>

        <button id="searchButton" class="primary-search" type="button">
          <span id="searchButtonText">搜索时间段内的航班</span><span>→</span>
        </button>
        <p class="search-note">只显示本次实时查询返回的当前报价；连接失败或航空公司未返回当前报价时，不使用历史价格兜底。</p>
      </section>
    </section>
  </main>

  <footer class="site-footer"><span>CTB Flights · 白俄留学生机票比价</span><span data-version></span></footer>

  <script src="./js/flight-data.js?v=1.1.0" defer></script>
  <script src="./js/home.js?v=1.1.0" defer></script>
  <script src="./js/version.js?v=1.1.0" defer></script>
</body>
</html>
